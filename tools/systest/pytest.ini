[pytest]
addopts = -ra
markers =
    offline: harness self-tests, need nothing
    virtual: the real midicontrol binary against a fake base on a pty (no hardware)
    bench: needs both units and probes (never run by default)
    slow: runs in real time for many seconds (keepalive 2 s / 6 s)
    req(id): requirement ID exactly as docs/SYSTEM.md writes it
testpaths = .
