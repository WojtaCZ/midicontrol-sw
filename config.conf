# MIDIControl PC player configuration.
#
# Looked up as: --config PATH, then $MIDICONTROL_CONFIG, then
# $XDG_CONFIG_HOME/midicontrol/config.conf (~/.config/...), then ./config.conf.
# Folder paths may start with ~/ ; relative paths are relative to this file.

[FILES]
PlayFolder = ~/Documents/music/play
RecordFolder = ~/Documents/music/record
# A leading zero does not name another song: 0406.mid is song 406 (default true).
SongCodeNormalise = true

[PLAYBACK]
# Delay between switching the organ on and the first note (ms).
WarmupMs = 3000
# Leave organ power on between songs (true, default; the idle power-off below switches it off later)
# or switch it off right after each song (false, the old behaviour).
KeepPowerOn = true
# Idle power-off: switch the organ off after this long without playback or recording (ms, >= 1000).
# Default 1800000 = 30 minutes. 0 = never switch off (the idle power-off is disabled; the organ then stays on
# until it is switched off by hand, at the base or with the console "off").
OrganIdleOffMs = 1800000
# Silence before a section repeated with "add verse", ms. The prelude/verse
# structure itself comes from the verse anchors in each MIDI file.
VerseGapMs = 0

# Status page and Stops editor (can write the per-song stop files) served by the player (all keys optional).
[WEB]
# Enabled = true
# Port = 50118
# IPv4 address to listen on; 0.0.0.0 = every interface (trusted LAN only).
# Bind = 0.0.0.0
# Host names (besides IP addresses and localhost) the page may be opened under when it changes something
# (stops, firmware upload, "Mark seen"); a foreign Host/Origin gets 403. Always accepted without listing:
# midicontrol, midicontrol.local, this machine's own hostname and <hostname>.local. Comma separated extras are
# added to those. "*" accepts any Host (switches the DNS-rebinding guard off; the Origin == Host rule stays).
# AllowedHosts =

# Diagnostics: the base's log CDC ("MIDIControl log") and the remote's DIAG records
# are stored here as JSONL (viewed on the status page's Diagnostics tab, `diag` command).
[DIAG]
# Serial device of the log CDC; by default it is found by its USB interface name.
# LogPort = /dev/ttyACM1
# Store directory (created if missing); default $XDG_STATE_HOME/midicontrol or ~/.local/state/midicontrol.
# Dir = ~/.local/state/midicontrol

# Organ stops (rejstriky) set at the start of a song; the choices are saved from the
# status page's stops editor (home view), one <PlayFolder>/<CODE>.conf per song (401.conf next to 401.mid). All keys optional; the defaults are
# the Johannus Opus 910. ProgramOffset is not yet verified at the organ (see
# docs/status-web-and-service.md, "Stops editor and the per-song stop files").
[ORGAN]
# false = never send stops (the page still works).
# StopsEnabled = true
# MIDI channel (1-16) of the stop Program Changes.
# Channel = 12
# Program = octal value of the stop's ST number + ProgramOffset.
# ProgramOffset = -1
# ST1 ... ST42: the stop's schematic number (octal digits), default as in the Opus 910 stop list.
# ST1 = 60
# Program1 ... Program42: program number (decimal, 0-127) for one stop; overrides ST + offset.
# Program1 = 47
# While a song with stops set plays, drop every Program Change in the song file
# (they were recorded on another organ).
# DropSongProgramChanges = true
# Default registration for songs WITHOUT a <CODE>.conf: stop numbers, e.g. 1,5,12.
# Empty = such songs leave the organ as it is. A file that exists (even empty = all off) wins.
# DefaultStops =
# SysEx (hex bytes) that switches all stops off, and the wait after it (ms).
# AllOffSysex = F0 00 4A 4F 48 41 53 7F F7
# AllOffDelayMs = 100
# Wait between the stop Program Changes and after the last one (ms).
# StopDelayMs = 20
# Group labels and stop ranges; the total stop count follows from the ranges.
# Groups = Spojky a pomocná zařízení:1-7, Pedál:8-16, I. manuál – hlavní stroj:17-29, II. manuál – žaluziový stroj:30-42
# Name1 ... Name42: stop names shown on the page (defaults: Czech names, see src/organ.cpp).
# Name1 = Spojka II/I

# Song-to-button bindings (parsed, reserved, unused: do not remove).
[BINDINGS]
Bind0 = 072 - Lide muj.mid
