# Installed as <prefix>/compose.yaml; variables come from .env next to it.
# install.sh rewrites every /opt/midicontrol below to the chosen MC_PREFIX.
name: midicontrol

services:
  midicontrol:
    image: ${IMAGE:-ghcr.io/wojtacz/midicontrol-sw-py}:${IMAGE_TAG:-stable}
    container_name: midicontrol
    network_mode: host
    restart: always
    # A remote update takes up to about 2.5 min (FAULTS.md); "docker stop" must not kill it (TODO B2, audit DK-1).
    stop_grace_period: 300s
    volumes:
      - /opt/midicontrol/data:/data
      - /dev:/dev
      - /etc/localtime:/etc/localtime:ro
    device_cgroup_rules:
      - "c 166:* rwm"   # ttyACM
      - "c 188:* rwm"   # ttyUSB
      - "c 116:* rwm"   # ALSA

  updater:
    image: ${IMAGE:-ghcr.io/wojtacz/midicontrol-sw-py}:${IMAGE_TAG:-stable}
    container_name: updater
    # Host network: the updater reaches the player's status endpoint at 127.0.0.1:50118.
    network_mode: host
    restart: always
    init: true   # PID 1 forwards TERM, so "docker stop" is fast
    command: ["midicontrol-updater"]
    working_dir: /opt/midicontrol
    env_file: .env
    environment:
      COMPOSE_PROJECT_NAME: midicontrol
      MC_PREFIX: /opt/midicontrol
      MC_DATA_DIR: /opt/midicontrol/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/midicontrol:/opt/midicontrol
      - /etc/localtime:/etc/localtime:ro
