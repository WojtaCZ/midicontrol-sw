# Web edition of the manual. `nav` is also the chapter order of the PDF.
site_name: "MIDIcontrol"
site_description: "MIDIcontrol – uživatelská příručka"
docs_dir: docs
site_dir: ../build/site

theme:
  name: material
  language: cs
  features:
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

# With --strict (docs-build always uses it) a link to a missing #anchor fails
# the build. Give headings you link to an explicit id: `## Reset { #reset }`.
validation:
  links:
    anchors: warn

# Only extensions whose output docs-build can carry into the PDF. Content tabs,
# Mermaid and raw HTML render on the web only; use SVG images for diagrams.
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Začátek: index.md
  - Hraní písně: hrani.md
  - Nahrávání: nahravani.md
  - Nová píseň a rejstříky: nova-pisen.md
  - Nastavení: nastaveni.md
  - Konfigurace počítače: pc.md
  - Opravy a obnova: opravy.md
